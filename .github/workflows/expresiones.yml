name: Expresiones
run-name: ¡Estoy aprendiendo a usar Expresiones!
on: 
  push
  workflow_dispatch

jobs:
  use-expressions:
    runs-on: ubuntu-latest
    steps:
      - name: condition
          if: ${{(github.event-name == 'push') || (github.event-name == 'workflow_dispatch')}}
          run: python hola_mundo.py

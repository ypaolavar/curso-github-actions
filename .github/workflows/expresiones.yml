name: Expresiones
run-name: ¡Estoy aprendiendo a usar Expresiones!
on: 
  push:
  workflow_dispatch:

jobs:
  use-expressions:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
      - name: condition
        if: ${{(github.event_name == 'push') || (github.event_name == 'workflow_dispatch')}}
        run: python hola_mundo.py

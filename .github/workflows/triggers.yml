name: Triggers
run-name: ¡Estoy aprendiendo a usar diferentes Triggers!
on: 
  push:
  issues:
  schedule:
    - cron: '15 22 * * *'

jobs:
  hola-mundo-manual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: name definition
        run: echo "USERNAME=${{ inputs.nombre}}" >> $GITHUB_ENV
      - name: python script
        run: hola-mundo.py

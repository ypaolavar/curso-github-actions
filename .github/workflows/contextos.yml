name: contextos
run-name: ¡ Estoy aprendiendo a usar contextos!
on:
  push:
  workflow_dispatch:

jobs:
  context-usage:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
      - name: python-script
        if: ${{github.event_name == 'push' }}
        run: python hola_mundo.py
